modLoader = "javafml"
loaderVersion = "${javaFmlVersionRange}"
license = "GPL-3.0-only"
issueTrackerURL = "https://github.com/KessokuTeaTime/Bounced/issues"

[[mods]]
modId = "bounced"
version = "${version}"
displayName = "${displayName}"
displayURL = "https://modrinth.com/mod/bounced"
logoFile = "assets/bounced/icon.png"
authors = "Kessoku Tea Time, KrLite"
description = "Bounces the Minecraft title whenever it appears."

[features.bounced]
javaVersion = "[${javaVersion},)"

[[dependencies.bounced]]
modId = "neoforge"
type = "required"
versionRange = "${neoforgeVersionRange}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.bounced]]
modId = "minecraft"
type = "required"
versionRange = "${neoforgeMinecraftVersionRange}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.bounced]]
modId = "splasher"
type = "optional"
versionRange = "[${splasherVersion},)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "bounced.mixins.json"
